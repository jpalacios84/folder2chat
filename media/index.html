<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>folder2chat</title>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 img-src %CSP_SOURCE% https: data:;
                 style-src %CSP_SOURCE% https: 'unsafe-inline';
                 script-src %CSP_SOURCE% https: 'unsafe-inline';
                 font-src %CSP_SOURCE% https:;">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="%STYLE_URI%" />
</head>
<body>
  <!-- Sticky toolbar that matches the page width -->
  <div class="toolbar shadow-sm">
    <!-- FLUID: use full width -->
    <div class="page page-fluid d-flex gap-2 align-items-center">
      <button id="browseFolderBtn" class="btn btn-secondary btn-sm">Browse</button>
      <input id="folderPath" type="text" class="form-control form-control-sm" placeholder="Folder path"/>
      <button id="refreshTreeBtn" class="btn btn-secondary btn-sm">Refresh</button>

      <div class="vr mx-1"></div>

      <div id="extChips" class="d-flex gap-1 flex-wrap"></div>

      <div class="ms-auto d-flex gap-3 align-items-center flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <label class="form-check-label small" for="includeTreeCheckbox">Include tree</label>
          <input class="form-check-input" type="checkbox" id="includeTreeCheckbox">
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="form-check-label small" for="includeInstructionsCheckbox">Include instructions</label>
          <input class="form-check-input" type="checkbox" id="includeInstructionsCheckbox" checked>
        </div>
        <button id="generateReportBtn" class="btn btn-success btn-sm">Generate</button>
      </div>
    </div>
  </div>

  <div id="spinner" class="spinner-overlay d-none">
    <div class="spinner-border" role="status" aria-label="loading"></div>
  </div>

  <!-- Main area fills viewport -->
  <div class="page page-fluid pad">
    
    <!-- Modern Settings Panel -->
    <details class="settings-panel mb-3">
      <summary class="settings-summary">
        <div class="d-flex align-items-center gap-2">
          <span class="fw-600">Configuration</span>
        </div>
        <span class="chevron"></span>
      </summary>
      
      <div class="settings-body">
        <div id="settingsAlerts" class="small mb-2"></div>
        
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <label for="limitInput" class="form-label small text-uppercase fw-bold settings-label">Limit Items</label>
            <input type="number" class="form-control form-control-sm" id="limitInput" value="100" />
          </div>
          <div class="col-12 col-md-4">
            <label for="textExtensionsInput" class="form-label small text-uppercase fw-bold settings-label">Extensions</label>
            <input type="text" class="form-control form-control-sm" id="textExtensionsInput" placeholder=".txt, .md, .py" />
          </div>
          <div class="col-12 col-md-4">
            <label for="defaultExcludedInput" class="form-label small text-uppercase fw-bold settings-label">Excluded Folders</label>
            <input type="text" class="form-control form-control-sm" id="defaultExcludedInput" placeholder=".git, node_modules" />
          </div>
        </div>

        <div class="d-flex align-items-end justify-content-between mt-3 pt-2 border-top border-opacity-10" style="border-color: var(--vscode-panel-border) !important;">
          <div>
            <label class="form-label small text-uppercase fw-bold mb-2 settings-label">Save Target</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="saveTarget" id="saveTargetWorkspace" value="workspace" checked>
                <label class="form-check-label small" for="saveTargetWorkspace">Workspace</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="saveTarget" id="saveTargetGlobal" value="global">
                <label class="form-check-label small" for="saveTargetGlobal">Global (User)</label>
              </div>
            </div>
          </div>
          <button id="saveSettingsBtn" class="btn btn-primary btn-sm px-3">Save Settings</button>
        </div>
      </div>
    </details>

    <div class="grid">
      <section class="panel">
        <header class="panel-header">
          <div class="d-flex align-items-center justify-content-between">
            <strong>Folder</strong>
            <div class="d-flex gap-2">
              <button id="selectAllBtn" class="btn btn-outline-secondary btn-sm">All</button>
              <button id="selectNoneBtn" class="btn btn-outline-secondary btn-sm">None</button>
              <button id="expandAllBtn" class="btn btn-outline-secondary btn-sm">Expand</button>
              <button id="collapseAllBtn" class="btn btn-outline-secondary btn-sm">Collapse</button>
            </div>
          </div>
        </header>
        <div id="treeContainer" class="tree-scroll"></div>
      </section>

      <section class="panel">
        <header class="panel-header">
          <div class="d-flex align-items-center justify-content-between w-100">
            <strong>Report</strong>
            <div class="d-flex align-items-center gap-2">
              <span id="statsBadge" class="badge bg-secondary-subtle text-body-secondary"></span>
              <button id="copyReportBtn" class="btn btn-outline-secondary btn-sm">Copy</button>
            </div>
          </div>
        </header>
        <textarea id="reportOutput" class="form-control report-box" readonly spellcheck="false"></textarea>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="%SCRIPT_URI%"></script>
</body>
</html>
